# Sources the event agents check on every sweep.
# Edit freely — agents re-read this file at the start of each run.
#
# Sections:
#   ics:      public calendar feeds, parsed deterministically (most reliable)
#   venues:   venue/studio websites whose what's-on pages the agent reads
#   listings: aggregator search/category pages the agent skims
#   keywords: web searches the agent runs to discover new things
#
# Fetch notes (checked Oct 2026): send a browser User-Agent. Rickshaw Stop,
# SFJAZZ and Freight & Salvage return 403 to plain fetches — use headless
# Chromium (executablePath /opt/pw-browsers/chromium, args
# --proxy-server=$HTTPS_PROXY --ssl-version-max=tls1.2; never `playwright install`).

ics:
  - name: Mox
    url: "https://api.lu.ma/ics/get?entity=calendar&id=cal-nfkEvDFat3zN1fe"
    tags: [tech, talk]
    # rationalist / AI-safety / EA community space, 1680 Mission St (https://lu.ma/mox)
  - name: AI Safety San Francisco
    url: "https://api.lu.ma/ics/get?entity=calendar&id=cal-D5yWBPY7IroUiUX"
    tags: [tech, talk]
    # AI safety + EA events around SF; overlaps with Mox (build.py dedupes same title/day)

