  - name: AI Safety San Francisco
    url: "https://api.lu.ma/ics/get?entity=calendar&id=cal-D5yWBPY7IroUiUX"
    tags: [tech, talk]
    # AI safety + EA events around SF; overlaps with Mox (build.py dedupes same title/day)

  - name: Big Brain Lectures - Bay Area
